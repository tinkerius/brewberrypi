<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrewberryPi</title>
  <meta name="description" content="BrewberryPi: an open-source Raspberry Pi controller for a home-brewing mash kettle.">
  <meta name="theme-color" content="#fbf8f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1719" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BrewberryPi">
  <meta property="og:description" content="An open-source Raspberry Pi controller for a home-brewing mash kettle.">
  <meta property="og:url" content="https://tinkerius.github.io/brewberrypi/">
  <meta property="og:image" content="https://tinkerius.github.io/brewberrypi/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="BrewberryPi logo: a berry-coloured brewing kettle on three flames">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    /* Colours and typeface from brand/README.md. */
    @font-face { font-family: "Zilla Slab"; font-weight: 500; font-display: swap; src: url("fonts/zilla-slab-medium.woff2") format("woff2"); }
    :root { color-scheme: light dark; --bg: #fbf8f6; --fg: #2a1d22; --muted: #6b5a61; --accent: #8a2a4a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1719; --fg: #f1e8eb; --muted: #a8979e; --accent: #e0789a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 36rem; padding: 2rem 1rem; text-align: center; }
    h1 { margin: 0 0 1.25rem; line-height: 0; }
    h1 img { width: min(17rem, 80vw); height: auto; }
    p { margin: .5rem 0; line-height: 1.5; }
    .tagline { font-family: "Zilla Slab", Rockwell, Georgia, serif; font-weight: 500; font-size: 1.35rem; text-wrap: balance; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>
      <picture>
        <source srcset="logo-stacked-dark.svg" media="(prefers-color-scheme: dark)">
        <img src="logo-stacked.svg" alt="BrewberryPi" width="272" height="179">
      </picture>
    </h1>
    <p class="tagline">A Raspberry Pi controller for a home-brewing mash kettle.</p>
    <p class="muted">Coming soon as open source.</p>
  </main>
</body>
</html>
