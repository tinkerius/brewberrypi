<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrewberryPi</title>
  <meta name="description" content="BrewberryPi: an open-source Raspberry Pi controller for a home-brewing mash kettle.">
  <style>
    :root { color-scheme: light dark; --bg: #fbfaf7; --fg: #1f2328; --muted: #59636e; --accent: #8a2a4a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15161a; --fg: #e6e6e6; --muted: #9aa0a6; --accent: #e0789a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 36rem; padding: 2rem 1rem; text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 2.5rem; color: var(--accent); }
    p { margin: .5rem 0; line-height: 1.5; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>BrewberryPi</h1>
    <p>A Raspberry Pi controller for a home-brewing mash kettle.</p>
    <p class="muted">Coming soon as open source.</p>
  </main>
</body>
</html>
